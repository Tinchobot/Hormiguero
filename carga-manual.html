pe="button" style="min-height: 44px; padding: 0 16px; border-radius: 999px; border: 1px solid rgba(62,39,35,0.6); background: linear-gradient(180deg, #6D4C41 0%, #3E2723 100%); box-shadow: inset 0 2px 1px rgba(255,255,255,0.9), inset 0 -3px 6px rgba(62,39,35,0.3), 0 4px 8px rgba(62,39,35,0.25); font: inherit; font-weight: 700; color: #FFE9C9">Alacrán</button></div>
